<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>My Stock Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">MY STOCK PORTFOLIO</p>
      <h1>투자 대시보드</h1>
      <p id="updated">시세 불러오는 중…</p>
    </div>
    <button id="refresh">새로고침</button>
  </header>

  <section class="summary">
    <article><span>평가금액</span><strong id="value">-</strong></article>
    <article><span>총 손익</span><strong id="pnl">-</strong></article>
    <article><span>총 수익률</span><strong id="return">-</strong></article>
  </section>

  <section>
    <div class="section-title">
      <h2>보유 종목</h2>
      <span>현재가 · 당일 · 매수가 대비 · 52주 고점 대비</span>
    </div>
    <div id="stocks" class="grid"></div>
  </section>

  <footer>
    개인 조회용 대시보드 · 시세는 데이터 제공처 사정에 따라 지연될 수 있습니다.
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
